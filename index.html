<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Image Display - Chadaporn</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 via-rose-50 to-indigo-100 min-h-screen flex items-center justify-center p-4 text-slate-800">

    <div class="max-w-2xl w-full mx-auto">
        <!-- Main Card -->
        <div class="glass-effect rounded-3xl shadow-2xl border border-white/60 overflow-hidden transition-all duration-300">
            
            <!-- Header Banner -->
            <div class="h-32 bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 relative">
                <div class="absolute top-4 right-4 flex space-x-2">
                    <button id="copyRawBtn" onclick="copyToClipboard('https://raw.githubusercontent.com/chadapornnn1/chadaporn/main/IMG_4917.JPG', 'คัดลอก Raw URL แล้ว!')" class="bg-white/20 hover:bg-white/30 text-white text-xs px-3 py-1.5 rounded-full backdrop-blur-md transition flex items-center gap-1 font-medium">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        คัดลอก Raw URL
                    </button>
                </div>
            </div>

            <!-- Profile Image Section -->
            <div class="px-6 pb-6 pt-0 relative flex flex-col items-center">
                <!-- Avatar Frame -->
                <div class="-mt-20 relative group cursor-pointer" onclick="openModal()">
                    <div class="w-36 h-36 md:w-44 md:h-44 rounded-full border-4 border-white shadow-xl overflow-hidden bg-slate-200 transition-transform duration-300 group-hover:scale-105 relative">
                        <img 
                            id="profileImg"
                            src="https://raw.githubusercontent.com/chadapornnn1/chadaporn/main/IMG_4917.JPG" 
                            alt="Profile Picture" 
                            class="w-full h-full object-cover object-center"
                            onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=600';"
                        />
                        <!-- Hover Overlay -->
                        <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-center justify-center text-white">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
                        </div>
                    </div>
                    <span class="absolute bottom-2 right-2 bg-emerald-500 border-2 border-white rounded-full w-5 h-5 shadow-sm" title="Online"></span>
                </div>

                <!-- User Information -->
                <div class="text-center mt-4 space-y-1">
                    <h1 class="text-2xl md:text-3xl font-bold text-slate-800">Chadaporn</h1>
                    <p class="text-sm text-slate-500 font-medium">@chadapornnn1</p>
                    <p class="text-xs text-indigo-600 bg-indigo-50 inline-block px-3 py-1 rounded-full font-medium mt-1">
                        GitHub Profile Image
                    </p>
                </div>

                <!-- Action Buttons -->
                <div class="mt-6 flex flex-wrap gap-3 justify-center w-full max-w-md">
                    <button onclick="openModal()" class="flex-1 min-w-[130px] bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl shadow-lg shadow-indigo-200 transition flex items-center justify-center gap-2 text-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        ดูรูปขนาดเต็ม
                    </button>
                    
                    <a href="https://github.com/chadapornnn1/chadaporn/blob/main/IMG_4917.JPG" target="_blank" rel="noopener noreferrer" class="flex-1 min-w-[130px] bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 px-4 rounded-xl shadow-lg shadow-slate-300 transition flex items-center justify-center gap-2 text-sm">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
                        เปิดใน GitHub
                    </a>
                </div>

                <!-- Info Card Detail -->
                <div class="mt-8 w-full bg-slate-50/80 rounded-2xl p-4 border border-slate-200/60 text-xs text-slate-600 space-y-2">
                    <div class="flex justify-between items-center border-b border-slate-200/80 pb-2">
                        <span class="font-medium text-slate-500">ชื่อไฟล์ (File Name)</span>
                        <span class="font-mono text-slate-800 bg-white px-2 py-0.5 rounded border border-slate-200">IMG_4917.JPG</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-slate-200/80 pb-2">
                        <span class="font-medium text-slate-500">เจ้าของคลัง (Repository)</span>
                        <span class="font-mono text-indigo-600 font-medium">chadapornnn1/chadaporn</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="font-medium text-slate-500">รูปแบบการแสดงผล</span>
                        <span class="text-emerald-600 font-medium">Direct Raw Asset</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Modal for Fullscreen View -->
    <div id="imageModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4 transition-all duration-300 opacity-0" onclick="closeModal()">
        <div class="relative max-w-4xl max-h-[90vh] w-full flex flex-col items-center justify-center" onclick="event.stopPropagation()">
            <!-- Close Button -->
            <button onclick="closeModal()" class="absolute -top-12 right-0 md:top-2 md:-right-12 text-white/80 hover:text-white bg-white/10 hover:bg-white/20 p-2 rounded-full backdrop-blur-md transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            
            <!-- Full Image -->
            <img 
                src="https://raw.githubusercontent.com/chadapornnn1/chadaporn/main/IMG_4917.JPG" 
                alt="Full Profile View" 
                class="max-h-[80vh] w-auto max-w-full rounded-2xl shadow-2xl object-contain border border-white/20"
            />
            
            <!-- Modal Caption -->
            <div class="mt-4 flex gap-3">
                <a href="https://raw.githubusercontent.com/chadapornnn1/chadaporn/main/IMG_4917.JPG" download target="_blank" class="bg-white/20 hover:bg-white/30 text-white text-sm font-medium px-4 py-2 rounded-xl backdrop-blur-md transition flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    ดาวน์โหลดภาพ
                </a>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl text-sm font-medium transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2 z-50">
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toastMessage">คัดลอกเรียบร้อย!</span>
    </div>

    <script>
        function openModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function copyToClipboard(text, msg) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            showToast(msg);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            toastMsg.innerText = message;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
